[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lymphnode"
version = "0.1.0"
description = "Lymph node vertex model simulation"
requires-python = ">=3.11"
dependencies = [
    "asciitree==0.3.3",
    "celluloid==0.2.0",
    "ipython-genutils==0.2.0",
    "joblib==1.4.2",
    "munkres==1.1.4",
    "nb-conda==2.2.1",
    "patsy==1.0.2",
    "ply==3.11",
    "PyQt5==5.15.7",
    "PyQt5-sip==12.11.0",
    "scikit-learn==1.5.1",
    "scikit-posthocs==0.11.4",
    "seaborn==0.13.2",
    "statsmodels==0.14.6",
    "tabulate==0.9.0",
    "threadpoolctl==3.5.0",
    "tyssue==0.9.0",
    "webencodings==0.5.1",
]
